<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" fill="none">
  <rect width="720" height="220" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="720" height="48" rx="12" fill="#161b22"/>
  <rect x="0" y="12" width="720" height="36" fill="#161b22"/>
  <circle cx="24" cy="24" r="6" fill="#3fb950"/>
  <text x="44" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">agentjail v0.9.0</text>
  <text x="210" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#8b949e">Honest Attestation &amp; Control-Plane Auth</text>

  <!-- Card 1: monitor mode -->
  <rect x="20" y="60" width="216" height="144" rx="8" fill="#1c2128" stroke="#3fb95044" stroke-width="1"/>
  <text x="36" y="80" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#3fb950">MONITOR MODE</text>
  <text x="36" y="100" font-family="monospace" font-size="10" fill="#8b949e">daemon evaluates everything</text>
  <text x="36" y="116" font-family="monospace" font-size="10" fill="#8b949e">enforces nothing</text>
  <text x="36" y="132" font-family="monospace" font-size="10" fill="#8b949e">records the would-fire verdict</text>
  <text x="36" y="148" font-family="monospace" font-size="10" fill="#8b949e">agentjail monitor shows it</text>
  <text x="36" y="164" font-family="monospace" font-size="10" fill="#8b949e">dial in rules before enforcing</text>
  <text x="36" y="188" font-family="monospace" font-size="10" fill="#6e7681">ADR 0091</text>

  <!-- Card 2: honest attestation -->
  <rect x="252" y="60" width="216" height="144" rx="8" fill="#1c2128" stroke="#d2992244" stroke-width="1"/>
  <text x="268" y="80" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#d29922">HONEST ATTESTATION</text>
  <text x="268" y="100" font-family="monospace" font-size="10" fill="#8b949e">badge attests the daemon</text>
  <text x="268" y="116" font-family="monospace" font-size="10" fill="#8b949e">not just the shield</text>
  <text x="268" y="132" font-family="monospace" font-size="10" fill="#8b949e">UNSECURED when not shielded</text>
  <text x="268" y="148" font-family="monospace" font-size="10" fill="#8b949e">degraded by default if daemon</text>
  <text x="268" y="164" font-family="monospace" font-size="10" fill="#8b949e">is unreachable, not silent-allow</text>
  <text x="268" y="188" font-family="monospace" font-size="10" fill="#6e7681">ADR 0064/0074/0085</text>

  <!-- Card 3: control-plane token -->
  <rect x="484" y="60" width="216" height="144" rx="8" fill="#1c2128" stroke="#58a6ff44" stroke-width="1"/>
  <text x="500" y="80" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#58a6ff">CONTROL-PLANE TOKEN</text>
  <text x="500" y="100" font-family="monospace" font-size="10" fill="#8b949e">every privileged verb needs</text>
  <text x="500" y="116" font-family="monospace" font-size="10" fill="#8b949e">a control-socket token</text>
  <text x="500" y="132" font-family="monospace" font-size="10" fill="#8b949e">shield withholds it from</text>
  <text x="500" y="148" font-family="monospace" font-size="10" fill="#8b949e">the sandboxed agent</text>
  <text x="500" y="164" font-family="monospace" font-size="10" fill="#8b949e">daemon/netproxy/secrets</text>
  <text x="500" y="188" font-family="monospace" font-size="10" fill="#6e7681">ADR 0067/0068/0069</text>
</svg>
