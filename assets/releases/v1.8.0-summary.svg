  <text x="36" y="180" font-family="monospace" font-size="10" fill="#6e7681">report instead of waiting</text>

  <rect x="252" y="60" width="216" height="142" rx="8" fill="#1c2128" stroke="#58a6ff44"/>
  <text x="268" y="82" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#58a6ff">STAYS CURRENT</text>
  <text x="268" y="108" font-family="monospace" font-size="10" fill="#f0f6fc">Background refresh</text>
  <text x="268" y="130" font-family="monospace" font-size="10" fill="#8b949e">Catches up after downtime</text>
  <text x="268" y="150" font-family="monospace" font-size="10" fill="#8b949e">Building + stale status</text>
  <text x="268" y="180" font-family="monospace" font-size="10" fill="#6e7681">nothing hidden behind a spinner</text>

  <rect x="484" y="60" width="216" height="142" rx="8" fill="#1c2128" stroke="#3fb95044"/>
  <text x="500" y="82" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#3fb950">PRIVATE + CORRECT</text>
