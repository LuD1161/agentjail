  <text x="500" y="130" font-family="monospace" font-size="10" fill="#8b949e">No prompts or responses</text>
  <text x="500" y="150" font-family="monospace" font-size="10" fill="#8b949e">Safe with live + forked files</text>
  <text x="500" y="180" font-family="monospace" font-size="10" fill="#6e7681">local and content-free</text>

