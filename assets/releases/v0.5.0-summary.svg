<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" fill="none">
  <rect width="720" height="220" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="720" height="48" rx="12" fill="#161b22"/>
  <rect x="0" y="12" width="720" height="36" fill="#161b22"/>
  <circle cx="24" cy="24" r="6" fill="#3fb950"/>
  <text x="44" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">agentjail v0.5.0</text>
  <text x="210" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#8b949e">Daemon Grant Server, Policy Simplification, Self-Update Fixes</text>

  <!-- Three cards -->
  <rect x="20" y="60" width="216" height="144" rx="8" fill="#1c2128" stroke="#3fb95044" stroke-width="1"/>
  <text x="36" y="80" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#3fb950">DAEMON GRANT SERVER</text>
  <text x="36" y="100" font-family="monospace" font-size="10" fill="#8b949e">Grant server moved to daemon</text>
  <text x="36" y="116" font-family="monospace" font-size="10" fill="#8b949e">PID-based session binding</text>
  <text x="36" y="132" font-family="monospace" font-size="10" fill="#8b949e">Peer credential extraction</text>
  <text x="36" y="148" font-family="monospace" font-size="10" fill="#8b949e">Transactional claim/approve</text>
  <text x="36" y="188" font-family="monospace" font-size="10" fill="#484f58">ADR 0047</text>

  <rect x="252" y="60" width="216" height="144" rx="8" fill="#1c2128" stroke="#58a6ff44" stroke-width="1"/>
  <text x="268" y="80" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#58a6ff">POLICY SIMPLIFICATION</text>
  <text x="268" y="100" font-family="monospace" font-size="10" fill="#8b949e">Removed no-hook-self-disable</text>
  <text x="268" y="116" font-family="monospace" font-size="10" fill="#8b949e">Targeted hook_config ask rule</text>
  <text x="268" y="132" font-family="monospace" font-size="10" fill="#8b949e">No more false positives</text>
  <text x="268" y="148" font-family="monospace" font-size="10" fill="#8b949e">make dev-install workflow</text>

  <rect x="484" y="60" width="216" height="144" rx="8" fill="#1c2128" stroke="#a371f744" stroke-width="1"/>
  <text x="500" y="80" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#a371f7">SELF-UPDATE + SHIELD</text>
  <text x="500" y="100" font-family="monospace" font-size="10" fill="#8b949e">Fail-open sentinel warning</text>
  <text x="500" y="116" font-family="monospace" font-size="10" fill="#8b949e">launchctl daemon restart</text>
  <text x="500" y="132" font-family="monospace" font-size="10" fill="#8b949e">SSH port 22 allowed</text>
  <text x="500" y="148" font-family="monospace" font-size="10" fill="#8b949e">Landlock ctl socket fix</text>
</svg>
