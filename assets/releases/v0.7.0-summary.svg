<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" fill="none">
  <rect width="720" height="220" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="720" height="48" rx="12" fill="#161b22"/>
  <rect x="0" y="12" width="720" height="36" fill="#161b22"/>
  <circle cx="24" cy="24" r="6" fill="#3fb950"/>
  <text x="44" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">agentjail v0.7.0</text>
  <text x="210" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#8b949e">Clean-VM Testbed Engine, Secrets-Broker Auto-Start, Shield $HOME Fix</text>

  <!-- Card 1: testbed engine -->
  <rect x="20" y="60" width="216" height="144" rx="8" fill="#1c2128" stroke="#3fb95044" stroke-width="1"/>
  <text x="36" y="80" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#3fb950">CLEAN-VM TESTBED ENGINE</text>
  <text x="36" y="100" font-family="monospace" font-size="10" fill="#8b949e">Real end-user VM per worktree</text>
  <text x="36" y="116" font-family="monospace" font-size="10" fill="#8b949e">make e2e-release gate</text>
  <text x="36" y="132" font-family="monospace" font-size="10" fill="#8b949e">15 scenarios, asciinema replay</text>
  <text x="36" y="148" font-family="monospace" font-size="10" fill="#8b949e">Lima/QEMU + Tart drivers</text>
  <text x="36" y="164" font-family="monospace" font-size="10" fill="#8b949e">Auto-sanitized recordings</text>
  <text x="36" y="188" font-family="monospace" font-size="10" fill="#6e7681">green on Linux + macOS</text>

  <!-- Card 2: secrets broker -->
  <rect x="252" y="60" width="216" height="144" rx="8" fill="#1c2128" stroke="#58a6ff44" stroke-width="1"/>
  <text x="268" y="80" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#58a6ff">SECRETS BROKER AUTO-START</text>
  <text x="268" y="100" font-family="monospace" font-size="10" fill="#8b949e">On-demand launch (ADR 0058)</text>
  <text x="268" y="116" font-family="monospace" font-size="10" fill="#8b949e">No manual `serve` needed</text>
  <text x="268" y="132" font-family="monospace" font-size="10" fill="#8b949e">launchd / systemd --user</text>
  <text x="268" y="148" font-family="monospace" font-size="10" fill="#8b949e">CGO-free (no socket-activation)</text>
  <text x="268" y="164" font-family="monospace" font-size="10" fill="#8b949e">Idle self-exit, grant-safe</text>
  <text x="268" y="188" font-family="monospace" font-size="10" fill="#6e7681">closes DEFECT-2</text>

  <!-- Card 3: shield $HOME fix -->
  <rect x="484" y="60" width="216" height="144" rx="8" fill="#1c2128" stroke="#f8514944" stroke-width="1"/>
  <text x="500" y="80" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#f85149">SHIELD $HOME READ-LEAK FIX</text>
  <text x="500" y="100" font-family="monospace" font-size="10" fill="#8b949e">cwd==$HOME no longer grants</text>
  <text x="500" y="116" font-family="monospace" font-size="10" fill="#8b949e">~/.ssh, ~/.aws, ~/.gnupg</text>
  <text x="500" y="132" font-family="monospace" font-size="10" fill="#8b949e">Workspace = non-hidden files</text>
  <text x="500" y="148" font-family="monospace" font-size="10" fill="#8b949e">Dotfiles denied by default</text>
  <text x="500" y="164" font-family="monospace" font-size="10" fill="#8b949e">macOS parity on Linux</text>
  <text x="500" y="188" font-family="monospace" font-size="10" fill="#6e7681">Landlock allowlist hardening</text>
</svg>
