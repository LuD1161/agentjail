<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" fill="none">
  <rect width="720" height="220" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="720" height="48" rx="12" fill="#161b22"/>
  <rect x="0" y="12" width="720" height="36" fill="#161b22"/>
  <circle cx="24" cy="24" r="6" fill="#3fb950"/>
  <text x="44" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">agentjail v0.10.0</text>
  <text x="230" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#8b949e">HTTP/2 + gRPC tunnel · real-agent verified</text>

  <!-- Card 1: HTTP/2 + gRPC -->
  <rect x="20" y="60" width="216" height="144" rx="8" fill="#1c2128" stroke="#3fb95044" stroke-width="1"/>
  <text x="36" y="80" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#3fb950">HTTP/2 + gRPC</text>
  <text x="36" y="100" font-family="monospace" font-size="10" fill="#8b949e">ALPN: serves h2 and http/1.1</text>
  <text x="36" y="116" font-family="monospace" font-size="10" fill="#8b949e">gRPC status + trailers preserved</text>
  <text x="36" y="132" font-family="monospace" font-size="10" fill="#8b949e">streaming RPCs never stall</text>
  <text x="36" y="148" font-family="monospace" font-size="10" fill="#8b949e">full parity with the h1.1 path</text>
  <text x="36" y="164" font-family="monospace" font-size="10" fill="#8b949e">decrypt · capture · policy</text>
  <text x="36" y="188" font-family="monospace" font-size="10" fill="#6e7681">ADR 0102</text>

  <!-- Card 2: real agent, installed build -->
  <rect x="252" y="60" width="216" height="144" rx="8" fill="#1c2128" stroke="#58a6ff44" stroke-width="1"/>
  <text x="268" y="80" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#58a6ff">REAL-AGENT VERIFIED</text>
  <text x="268" y="100" font-family="monospace" font-size="10" fill="#8b949e">live Claude session in a VM</text>
  <text x="268" y="116" font-family="monospace" font-size="10" fill="#8b949e">through the installed build</text>
  <text x="268" y="132" font-family="monospace" font-size="10" fill="#8b949e">18 reqs · 5 model turns</text>
  <text x="268" y="148" font-family="monospace" font-size="10" fill="#8b949e">252 KB decrypted · 0 leaks</text>
  <text x="268" y="164" font-family="monospace" font-size="10" fill="#8b949e">repeatable golden-VM gate</text>
  <text x="268" y="188" font-family="monospace" font-size="10" fill="#6e7681">testbed: tunnel-agent</text>

  <!-- Card 3: three fixes -->
  <rect x="484" y="60" width="216" height="144" rx="8" fill="#1c2128" stroke="#d2992244" stroke-width="1"/>
  <text x="500" y="80" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#d29922">INSTALLED-BUILD FIXES</text>
  <text x="500" y="100" font-family="monospace" font-size="10" fill="#8b949e">was: silent netproxy fallback</text>
  <text x="500" y="116" font-family="monospace" font-size="10" fill="#8b949e">re-exec dispatch by argv[0]</text>
  <text x="500" y="132" font-family="monospace" font-size="10" fill="#8b949e">holder liveness via socket</text>
  <text x="500" y="148" font-family="monospace" font-size="10" fill="#8b949e">netns DNS for systemd-resolved</text>
  <text x="500" y="164" font-family="monospace" font-size="10" fill="#8b949e">userns: doctor guides the fix</text>
  <text x="500" y="188" font-family="monospace" font-size="10" fill="#6e7681">ADR 0103</text>
</svg>
