<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">AgentJail v1.8.1: clearer CLI help, consistent Codex approvals</title>
  <desc id="desc">Current launch flags, policy approvals through the explicit launcher, and styled help across commands.</desc>
  <rect width="720" height="240" rx="12" fill="#0d1117"/>
  <path d="M12 0H708Q720 0 720 12V48H0V12Q0 0 12 0" fill="#161b22"/>
  <circle cx="24" cy="24" r="6" fill="#3fb950"/>
  <g font-family="system-ui,-apple-system,sans-serif">
    <text x="44" y="30" font-size="16" font-weight="700" fill="#f0f6fc">agentjail v1.8.1</text>
    <text x="210" y="30" font-size="14" fill="#8b949e">Clearer help. Consistent approvals.</text>
    <rect x="20" y="64" width="216" height="136" rx="8" fill="#1c2128" stroke="#30363d"/>
    <rect x="252" y="64" width="216" height="136" rx="8" fill="#1c2128" stroke="#30363d"/>
    <rect x="484" y="64" width="216" height="136" rx="8" fill="#1c2128" stroke="#30363d"/>
    <g font-size="11" font-weight="700">
      <text x="36" y="88" fill="#f0883e">KEEP POLICY APPROVALS</text>
      <text x="268" y="88" fill="#58a6ff">FIND THE RIGHT OPTION</text>
      <text x="500" y="88" fill="#3fb950">LAUNCH WITH CLARITY</text>
    </g>
    <g font-size="13" fill="#f0f6fc">
      <text x="36" y="117">Explicit Codex launches</text>
      <text x="268" y="117">Styled help, everywhere</text>
      <text x="500" y="117">Current native flags</text>
    </g>
    <g font-size="12" fill="#8b949e">
      <text x="36" y="143">Native bypass flags retain</text>
      <text x="36" y="162">AgentJail rule prompts.</text>
      <text x="268" y="143">Nested commands, examples,</text>
      <text x="268" y="162">local and global options.</text>
      <text x="500" y="143">Optional separator explained.</text>
      <text x="500" y="162">New: agentjail run help</text>
    </g>
    <text x="360" y="224" text-anchor="middle" font-size="11" fill="#8b949e">A focused CLI patch. Built on v1.8.0.</text>
  </g>
</svg>
