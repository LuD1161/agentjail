<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" fill="none">
  <rect width="720" height="220" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="720" height="48" rx="12" fill="#161b22"/>
  <rect x="0" y="12" width="720" height="36" fill="#161b22"/>
  <circle cx="24" cy="24" r="6" fill="#3fb950"/>
  <text x="44" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">agentjail v0.6.0</text>
  <text x="210" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#8b949e">Credential Hardening, macOS Shield + SSH-Agent, Linux Install</text>

  <!-- Card 1: security hardening -->
  <rect x="20" y="60" width="216" height="144" rx="8" fill="#1c2128" stroke="#3fb95044" stroke-width="1"/>
  <text x="36" y="80" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#3fb950">CREDENTIAL HARDENING</text>
  <text x="36" y="100" font-family="monospace" font-size="10" fill="#8b949e">Broker master key protected</text>
  <text x="36" y="116" font-family="monospace" font-size="10" fill="#8b949e">Postgres pw argv leak fixed</text>
  <text x="36" y="132" font-family="monospace" font-size="10" fill="#8b949e">Grants auto-expire + TTL cap</text>
  <text x="36" y="148" font-family="monospace" font-size="10" fill="#8b949e">Daemon peer UID/CWD verified</text>
  <text x="36" y="164" font-family="monospace" font-size="10" fill="#8b949e">IMDS metadata egress blocked</text>

  <!-- Card 2: macOS shield + ssh-agent -->
  <rect x="252" y="60" width="216" height="144" rx="8" fill="#1c2128" stroke="#58a6ff44" stroke-width="1"/>
  <text x="268" y="80" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#58a6ff">macOS SHIELD + SSH-AGENT</text>
  <text x="268" y="100" font-family="monospace" font-size="10" fill="#8b949e">SSH_AUTH_SOCK passthrough</text>
  <text x="268" y="116" font-family="monospace" font-size="10" fill="#8b949e">Agent socket on seatbelt</text>
  <text x="268" y="132" font-family="monospace" font-size="10" fill="#8b949e">Pinned-IdentityFile fix</text>
  <text x="268" y="148" font-family="monospace" font-size="10" fill="#8b949e">doctor + hook advisories</text>
  <text x="268" y="164" font-family="monospace" font-size="10" fill="#8b949e">.env deny-list inversion</text>
  <text x="268" y="188" font-family="monospace" font-size="10" fill="#484f58">ADR 0056 / 0057</text>

  <!-- Card 3: control plane + install -->
  <rect x="484" y="60" width="216" height="144" rx="8" fill="#1c2128" stroke="#a371f744" stroke-width="1"/>
  <text x="500" y="80" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#a371f7">CONTROL PLANE + INSTALL</text>
  <text x="500" y="100" font-family="monospace" font-size="10" fill="#8b949e">Daemon control-socket reload</text>
  <text x="500" y="116" font-family="monospace" font-size="10" fill="#8b949e">daemon_unreachable knob</text>
  <text x="500" y="132" font-family="monospace" font-size="10" fill="#8b949e">Linux systemd --user install</text>
  <text x="500" y="148" font-family="monospace" font-size="10" fill="#8b949e">Clean-VM testbed + e2e gate</text>
  <text x="500" y="164" font-family="monospace" font-size="10" fill="#8b949e">Hook re-assert before exec</text>
  <text x="500" y="188" font-family="monospace" font-size="10" fill="#484f58">ADR 0050 / 0052 / 0053</text>
</svg>
