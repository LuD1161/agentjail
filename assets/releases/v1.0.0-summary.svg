<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" fill="none">
  <rect width="720" height="220" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="720" height="48" rx="12" fill="#161b22"/>
  <rect x="0" y="12" width="720" height="36" fill="#161b22"/>
  <circle cx="24" cy="24" r="6" fill="#3fb950"/>
  <text x="44" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">agentjail v1.0.0</text>
  <text x="214" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#8b949e">See your agent's LLM traffic · no system extension</text>

  <!-- Card 1: capture gateway -->
  <rect x="20" y="60" width="216" height="144" rx="8" fill="#1c2128" stroke="#3fb95044" stroke-width="1"/>
  <text x="36" y="80" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#3fb950">CAPTURE GATEWAY</text>
  <text x="36" y="100" font-family="monospace" font-size="10" fill="#8b949e">no system extension needed</text>
  <text x="36" y="116" font-family="monospace" font-size="10" fill="#8b949e">ANTHROPIC_BASE_URL &#8594; proxy</text>
  <text x="36" y="132" font-family="monospace" font-size="10" fill="#8b949e">POST /v1/messages recorded</text>
  <text x="36" y="148" font-family="monospace" font-size="10" fill="#8b949e">bodies encrypted at rest</text>
  <text x="36" y="164" font-family="monospace" font-size="10" fill="#8b949e">plain and --tunnel · fail-closed</text>
  <text x="36" y="188" font-family="monospace" font-size="10" fill="#6e7681">AGE-259 · ADR 0109</text>

  <!-- Card 2: transparent tunnel -->
  <rect x="252" y="60" width="216" height="144" rx="8" fill="#1c2128" stroke="#58a6ff44" stroke-width="1"/>
  <text x="268" y="80" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#58a6ff">TRANSPARENT TUNNEL</text>
  <text x="268" y="100" font-family="monospace" font-size="10" fill="#8b949e">macOS NETransparentProxy</text>
  <text x="268" y="116" font-family="monospace" font-size="10" fill="#8b949e">same gVisor + MITM as Linux</text>
  <text x="268" y="132" font-family="monospace" font-size="10" fill="#8b949e">HTTP/2 + gRPC via ALPN h2</text>
  <text x="268" y="148" font-family="monospace" font-size="10" fill="#8b949e">IPv6 datapath (opt-in)</text>
  <text x="268" y="164" font-family="monospace" font-size="10" fill="#8b949e">streams never stall</text>
  <text x="268" y="188" font-family="monospace" font-size="10" fill="#6e7681">AGE-262 · ADR 0102</text>

  <!-- Card 3: network UI, real-agent verified -->
  <rect x="484" y="60" width="216" height="144" rx="8" fill="#1c2128" stroke="#d2992244" stroke-width="1"/>
  <text x="500" y="80" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#d29922">NETWORK UI · REAL AGENT</text>
  <text x="500" y="100" font-family="monospace" font-size="10" fill="#8b949e">per-session request timelines</text>
  <text x="500" y="116" font-family="monospace" font-size="10" fill="#8b949e">filters + body viewer</text>
  <text x="500" y="132" font-family="monospace" font-size="10" fill="#8b949e">live Claude in a VM</text>
  <text x="500" y="148" font-family="monospace" font-size="10" fill="#8b949e">through the installed build</text>
  <text x="500" y="164" font-family="monospace" font-size="10" fill="#8b949e">repeatable golden-VM gate</text>
  <text x="500" y="188" font-family="monospace" font-size="10" fill="#6e7681">ADR 0103</text>
</svg>
