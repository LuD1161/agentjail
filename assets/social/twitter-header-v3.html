<title>AgentJail - Twitter Header</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;background:#1a1a1a;padding:40px 20px;font-family:system-ui,sans-serif}
.wrapper{width:100%;max-width:1500px}
.label{color:#777;font-size:12px;margin-bottom:10px;letter-spacing:1px;text-transform:uppercase}
svg{width:100%;height:auto;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
</style>
<div class="wrapper">
<div class="label">Twitter Header 1500x500</div>
<svg id="h" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<script>
const s=document.getElementById('h'),N='http://www.w3.org/2000/svg',C=13,B=12;
function e(t,a){const r=document.createElementNS(N,t);for(const[k,v]of Object.entries(a))r.setAttribute(k,v);return r}
s.appendChild(e('rect',{width:1500,height:500,fill:'#f5f0eb'}));
const F={A:['..####..','.##..##.','##....##','##....##','########','##....##','##....##','##....##','##....##'],G:['.######.','##....##','##......','##......','##..####','##....##','##....##','##....##','.######.'],E:['########','##......','##......','##......','######..','##......','##......','##......','########'],N:['##....##','###...##','####..##','##.##.##','##..####','##...###','##....##','##....##','##....##'],T:['########','...##...','...##...','...##...','...##...','...##...','...##...','...##...','...##...'],J:['..######','.....##.','.....##.','.....##.','.....##.','.....##.','##...##.','##...##.','.#####..'],I:['########','...##...','...##...','...##...','...##...','...##...','...##...','...##...','########'],L:['##......','##......','##......','##......','##......','##......','##......','##......','########']};
const W='AGENTJAIL',tc=W.length*8+(W.length-1)*2,tp=tc*C,sx=(1500-tp)/2,sy=125;
for(let i=0;i<W.length;i++){const b=F[W[i]],ox=sx+i*10*C;for(let r=0;r<b.length;r++)for(let c=0;c<b[r].length;c++)if(b[r][c]==='#')s.appendChild(e('rect',{x:ox+c*C,y:sy+r*C,width:B,height:B,fill:'#1a1a1a'}))}
const tr=sx+tp,st=e('text',{x:tr,y:sy+9*C+52,'text-anchor':'end','font-family':"'SF Mono','Consolas',monospace",'font-size':'22',fill:'#555','letter-spacing':'3'});
st.textContent='policy guardrails for coding agents';s.appendChild(st);
// --- SVG defs: gradients, shadows ---
const defs=document.createElementNS(N,'defs');

// Drop shadow filter
const filt=document.createElementNS(N,'filter');
filt.setAttribute('id','bshadow');filt.setAttribute('x','-10%');filt.setAttribute('y','-10%');
filt.setAttribute('width','130%');filt.setAttribute('height','150%');
const feOff=e('feOffset',{dx:'0',dy:'2',in:'SourceAlpha',result:'off'});
const feBlur=e('feGaussianBlur',{in:'off',stdDeviation:'3',result:'blur'});
const feFlood=e('feFlood',{'flood-color':'#000','flood-opacity':'0.25',result:'color'});
const feComp=e('feComposite',{in:'color',in2:'blur',operator:'in',result:'shadow'});
const feMerge=document.createElementNS(N,'feMerge');
feMerge.appendChild(e('feMergeNode',{in:'shadow'}));
feMerge.appendChild(e('feMergeNode',{in:'SourceGraphic'}));
filt.appendChild(feOff);filt.appendChild(feBlur);filt.appendChild(feFlood);filt.appendChild(feComp);filt.appendChild(feMerge);
defs.appendChild(filt);

// Gradient for gray section (top highlight)
const gGray=document.createElementNS(N,'linearGradient');
gGray.setAttribute('id','gGray');gGray.setAttribute('x1','0');gGray.setAttribute('y1','0');
gGray.setAttribute('x2','0');gGray.setAttribute('y2','1');
gGray.appendChild(e('stop',{offset:'0',style:'stop-color:#777'}));
gGray.appendChild(e('stop',{offset:'0.5',style:'stop-color:#555'}));
gGray.appendChild(e('stop',{offset:'1',style:'stop-color:#444'}));
defs.appendChild(gGray);

// Gradient for green section
const gGreen=document.createElementNS(N,'linearGradient');
gGreen.setAttribute('id','gGreen');gGreen.setAttribute('x1','0');gGreen.setAttribute('y1','0');
gGreen.setAttribute('x2','0');gGreen.setAttribute('y2','1');
gGreen.appendChild(e('stop',{offset:'0',style:'stop-color:#b0e000'}));
gGreen.appendChild(e('stop',{offset:'0.5',style:'stop-color:#97CA00'}));
gGreen.appendChild(e('stop',{offset:'1',style:'stop-color:#7aaa00'}));
defs.appendChild(gGreen);

// Gradient for GitHub pill
const gDark=document.createElementNS(N,'linearGradient');
gDark.setAttribute('id','gDark');gDark.setAttribute('x1','0');gDark.setAttribute('y1','0');
gDark.setAttribute('x2','0');gDark.setAttribute('y2','1');
gDark.appendChild(e('stop',{offset:'0',style:'stop-color:#3a3a3a'}));
gDark.appendChild(e('stop',{offset:'0.5',style:'stop-color:#2a2a2a'}));
gDark.appendChild(e('stop',{offset:'1',style:'stop-color:#1a1a1a'}));
defs.appendChild(gDark);

s.appendChild(defs);

// --- Layout ---
const by=435;
const bh=32,br=6,by2=by-bh/2,lw=74,vw=110;
const ghPillW=240,ghPillH=bh,ghGap=14;
const badgeX=tr-lw-vw;
const ghX=badgeX-ghPillW-ghGap;

// --- GitHub pill ---
const ghG=document.createElementNS(N,'g');
ghG.setAttribute('filter','url(#bshadow)');
ghG.appendChild(e('rect',{x:ghX,y:by2,width:ghPillW,height:ghPillH,fill:'url(#gDark)',rx:br,ry:br}));
// highlight line at top
ghG.appendChild(e('rect',{x:ghX+4,y:by2+1,width:ghPillW-8,height:1,fill:'rgba(255,255,255,0.15)',rx:1}));
s.appendChild(ghG);

// GitHub mark inside pill
const ghIcon=document.createElementNS(N,'g');
const ghScale=1.25;
ghIcon.setAttribute('transform','translate('+(ghX+12)+','+(by2+6)+') scale('+ghScale+')');
ghIcon.appendChild(e('path',{d:'M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z',fill:'#fff','fill-rule':'evenodd'}));
s.appendChild(ghIcon);

// Repo text inside pill
const rt=e('text',{x:ghX+44,y:by2+ghPillH/2,'text-anchor':'start','dominant-baseline':'central','font-family':"'SF Mono','Consolas',monospace",'font-size':'16','font-weight':'600',fill:'#eee','letter-spacing':'0.5'});
rt.textContent='lud1161/agentjail';s.appendChild(rt);

// --- License badge (3D) ---
const badgeG=document.createElementNS(N,'g');
badgeG.setAttribute('filter','url(#bshadow)');
// Left section with gradient
badgeG.appendChild(e('rect',{x:badgeX,y:by2,width:lw,height:bh,fill:'url(#gGray)',rx:br,ry:br}));
badgeG.appendChild(e('rect',{x:badgeX+lw-br,y:by2,width:br,height:bh,fill:'url(#gGray)'}));
// Right section with gradient
badgeG.appendChild(e('rect',{x:badgeX+lw,y:by2,width:vw,height:bh,fill:'url(#gGreen)',rx:br,ry:br}));
badgeG.appendChild(e('rect',{x:badgeX+lw,y:by2,width:br,height:bh,fill:'url(#gGreen)'}));
// Highlight line at top
badgeG.appendChild(e('rect',{x:badgeX+4,y:by2+1,width:lw+vw-8,height:1,fill:'rgba(255,255,255,0.2)',rx:1}));
s.appendChild(badgeG);

const lt=e('text',{x:badgeX+lw/2,y:by2+bh/2,'text-anchor':'middle','dominant-baseline':'central','font-family':"Verdana,Geneva,sans-serif",'font-size':'14','font-weight':'700',fill:'#fff'});
lt.textContent='license';s.appendChild(lt);
const vt=e('text',{x:badgeX+lw+vw/2,y:by2+bh/2,'text-anchor':'middle','dominant-baseline':'central','font-family':"Verdana,Geneva,sans-serif",'font-size':'14','font-weight':'700',fill:'#1a1a1a'});
vt.textContent='Apache-2.0';s.appendChild(vt);
</script>
