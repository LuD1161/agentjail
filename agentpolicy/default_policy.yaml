# agentjail default policy configuration
# Place at ~/.agentjail/policy.yaml and customize.
#
# The daemon loads this file at startup and on SIGHUP.
# Unknown keys cause a startup error (strict YAML parsing).

mcp:
  # Allowlist of MCP server name patterns (glob). Empty = deny all.
  # Examples: "filesystem", "fetch", "github*"
  allowed: []

  # Blocklist patterns take precedence over allowed.
  # Agents should never be permitted to call payment or comms services
  # without explicit review — keep these blocked by default.
  blocked:
    - "*stripe*"
    - "*payment*"
    - "*billing*"
    - "*twilio*"
    - "*sendgrid*"

  # Per-server tool allowlists (Level 1 MCP gating — ADR 0003).
  # When a server's allowed_tools list is non-empty, only those tools may be
  # called; all others are denied with rule_id mcp_policy/tool_not_allowed.
  # When allowed_tools is empty or absent, all tools of an allowed server are
  # permitted (backwards-compatible default).
  #
  # Example: allow filesystem reads but not writes; allow fetch only via fetch.
  #
  # servers:
  #   filesystem:
  #     allowed_tools: ["read_file", "list_directory"]  # write_file implicitly denied
  #   fetch:
  #     allowed_tools: ["fetch"]
  servers: {}

file:
  # Additional paths to deny (beyond the built-in macOS sensitive path list).
  # The built-in list covers: ~/.ssh, ~/.aws, ~/.gnupg, ~/.config, ~/Downloads,
  # ~/Desktop, ~/.env, **/credentials*, **/secrets*, **/*.pem, **/*.key,
  # ~/.agentjail/, /etc/, /var/
  extra_deny: []

  # Additional paths to always allow (beyond the agent's CWD).
  extra_allow: []

commands:
  # Additional shell command patterns to block (Go regex syntax).
  # The built-in list covers: rm -rf outside project, curl|bash, sudo, dd,
  # chmod -R 777, git push --force, ssh-keygen, gpg --export-secret-keys,
  # env|curl exfil pattern.
  extra_block: []

network:
  # Hosts whose resolved IP addresses are permitted for outbound TCP
  # connections when agentjail-shield is active, and hosts allowed through
  # agentjail-netproxy's hostname-based egress filter (the real enforcement
  # point on both OSes).
  #
  # The essential provider hosts (api.anthropic.com, claude.ai,
  # platform.claude.com, api.openai.com, auth.openai.com, chatgpt.com,
  # accounts.google.com, oauth2.googleapis.com) are ALWAYS allowed -- they are
  # baked into agentpolicy/config (EssentialAllowedHosts) and are
  # intentionally NOT listed here, because they cannot be removed by editing
  # this file. This list below is the EDITABLE / removable extended set: the
  # agent's effective allowlist is always essentials + this list (additive),
  # never just this list alone.
  #
  # Filtering at the shield layer is IP-based: hostnames are resolved once at
  # shield startup. CDN-backed hosts (npm, pypi, github) rotate IPs
  # frequently; if a connection is refused after a long session, restarting
  # the shield re-resolves the latest IPs. netproxy filters per-request by
  # hostname and does not share this staleness trade-off.
  #
  # DNS (UDP port 53) and loopback (127.0.0.1 / ::1) are always allowed
  # regardless of this list.
  #
  # Linux: Landlock has no network ABI, so the shield's own IP-based rules are
  # not enforced there; agentjail-netproxy is the enforcement point on Linux.
  allowed_hosts:
    # Anthropic (non-essential / broad)
    - "*.claude.ai"
    - statsig.anthropic.com
    - sentry.io
    - "*.sentry.io"
    # Google (broad wildcard stays removable)
    - "*.googleapis.com"
    # OpenAI Codex extras (core codex hosts are essential above)
    # Cursor CLI (exact required subdomains, removable)
    - api2.cursor.sh
    - api5.cursor.sh
    - agent.api5.cursor.sh
    - agentn.api5.cursor.sh
    - authenticate.cursor.sh
    - authenticator.cursor.sh
    - authentication.cursor.sh
    - prod.authentication.cursor.sh
    # Hosted MCP servers (the MCP call is still gated by mcp.allowed)
    - api.linear.app
    - mcp.linear.app
    - "*.posthog.com"
    - api.typefully.com
    - api.githubcopilot.com
    - mcp.context7.com
    - mcp.deepwiki.com
    - mcp.notion.com
    - mcp.cloudflare.com
    - hf.co
    # Package registries
    - registry.npmjs.org
    - registry.yarnpkg.com
    - pypi.org
    - files.pythonhosted.org
    - crates.io
    - static.crates.io
    - index.crates.io
    - proxy.golang.org
    - sum.golang.org
    - repo1.maven.org
    - repo.maven.apache.org
    - plugins.gradle.org
    - rubygems.org
    - deno.land
    - cdn.jsdelivr.net
    - unpkg.com
    - esm.sh
    - "*.huggingface.co"
    # Git hosting
    - github.com
    - api.github.com
    - raw.githubusercontent.com
    - objects.githubusercontent.com
    - github-releases.githubusercontent.com
    - codeload.github.com
    - ghcr.io
    - gitlab.com
    - registry.gitlab.com
    # Documentation
    - docs.python.org
    - docs.rs
    - doc.rust-lang.org
    - nodejs.org
    - go.dev
    - pkg.go.dev
    - developer.mozilla.org
    - learn.microsoft.com
    # agentjail anonymous telemetry (users may remove)
    - us.i.posthog.com
web:
  # The agent's web read tools — WebSearch and WebFetch — are allowed by default
  # so they don't prompt on every call. WebSearch is always allowed; WebFetch is
  # a read-only GET allowed unless its target host matches a pattern below.
  #
  # Patterns are host globs, matched case-insensitively, where "*" spans dots:
  #   "*tracking*"   → any host containing "tracking" (incl. subdomains)
  #   "*.internal"   → any host ending in ".internal"
  #   "169.254.*"    → link-local metadata addresses
  # This is domain control, not exfil-proofing (a determined agent can pick an
  # unlisted host; Bash curl/POST stays governed by command policy). To make
  # WebFetch prompt again, add "web_policy/fetch" to disabled_rules.
  blocked: []
