name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # Two branches can pick the same ADR number without either noticing; it
      # only bites at merge, when a bare "ADR 0049" stops identifying one
      # document. Catch it here instead. See ADR 0083-adr-numbering-scheme.
      - name: adr check
        run: ./scripts/adr-check.sh

      - name: test
        run: go test ./... -race

      - name: setup opa
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: opa test
        run: opa test agentpolicy/policies/

  # The Go jobs above deliberately set up Go only: a clean clone must build with
  # no Node toolchain, embedding the tracked static/dist/.gitkeep placeholder.
  # This job is the only one that needs bun — it proves the SPA still builds and
  # that THIRD_PARTY_LICENSES covers the npm packages shipped inside the binary.
  frontend:
    name: frontend (build + licenses)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: cmd/agentjail/ui/frontend/.bun-version

      - name: build web UI
        run: make ui

      - name: go build with the real SPA embedded
        run: go build ./...

      # Fails if a dependency changed without regenerating attributions. The npm
      # half is not skippable: the script errors when node_modules is absent.
      - name: licenses check
        run: make licenses-check

  smoke:
    name: smoke (hook e2e)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Only the deterministic hook E2E smoke is run here.
      # The shield/netproxy smoke (cmd/agentjail-shield/test/smoke.sh) is
      # deliberately excluded from CI because it exercises live-network/netproxy
      # fixtures (DNS, api.github.com) that are non-deterministic in CI; it
      # remains a local-dev target under `make smoke`.
      - name: hook smoke
        run: bash cmd/agentjail-hook/test/smoke.sh

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: e2e new-user test
        run: bash test/e2e-newuser.sh
