name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in private validation artifacts (for example v1.7.0)
        required: true
        default: v1.7.0
        type: string

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
            goos: darwin
            goarch: arm64
          - platform: darwin-amd64
            runner: macos-14
            goos: darwin
            goarch: amd64
          - platform: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - platform: linux-arm64
            runner: ubuntu-latest
            goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: cmd/agentjail/ui/frontend/.bun-version

      # Must precede the go build: without it the binary embeds only the
      # static/dist/.gitkeep placeholder and silently ships the legacy HTML UI.
      # `make ui` hard-fails if dist/index.html is not produced.
      - name: build web UI
        run: make ui

      # Runs after `make ui` so node_modules exists — the npm half of the
      # attribution cannot be enumerated without it, and refuses to be skipped.
      - name: regenerate THIRD_PARTY_LICENSES
        run: ./scripts/gen-third-party-licenses.sh

      # A tag must not ship attributions that differ from the committed file.
      - name: fail if THIRD_PARTY_LICENSES was stale
        run: git diff --exit-code -- THIRD_PARTY_LICENSES

      - name: build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          POSTHOG_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
        run: |
          VERSION="${RELEASE_VERSION}"
          LDFLAGS="-X github.com/LuD1161/agentjail/internal/buildinfo.Version=${VERSION} -X github.com/LuD1161/agentjail/internal/telemetry.apiKey=${POSTHOG_KEY} -X github.com/LuD1161/agentjail/internal/selfupdate.SigningPubKey=RWRg/Bbl+U571C1qv/08AwUwlvf6zG4lYzV8e0QHFd0FrjYTmImUoRpQ -s -w"
          mkdir -p dist
          for bin in agentjail agentjail-hook; do
            echo "building ${bin}..."
            go build -ldflags "${LDFLAGS}" -o "dist/${bin}" "./cmd/${bin}"
          done

      - name: codesign + notarize (macOS only)
        if: matrix.goos == 'darwin' && env.APPLE_CERTIFICATE_P12 != ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -eu

          # Import certificate into a temporary keychain
          KEYCHAIN="build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 3600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"

          echo "${APPLE_CERTIFICATE_P12}" | base64 -d > /tmp/certificate.p12
          security import /tmp/certificate.p12 -k "${KEYCHAIN}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          rm -f /tmp/certificate.p12

          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"

          IDENTITY="${APPLE_SIGNING_IDENTITY}"

          # Sign each binary
          for bin in dist/agentjail dist/agentjail-hook; do
            echo "signing $(basename ${bin})..."
            codesign --force --options runtime --sign "${IDENTITY}" \
              --timestamp "${bin}"
          done

          # Create a zip for notarization (notarytool requires zip/dmg/pkg)
          ditto -c -k --keepParent dist /tmp/agentjail-notarize.zip

          # Submit for notarization and wait
          echo "submitting for notarization..."
          xcrun notarytool submit /tmp/agentjail-notarize.zip \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_ID_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait --timeout 10m

          rm -f /tmp/agentjail-notarize.zip

          # Verify signatures
          for bin in dist/agentjail dist/agentjail-hook; do
            echo "verifying $(basename ${bin})..."
            codesign --verify --verbose=2 "${bin}"
          done

          # Clean up keychain
          security delete-keychain "${KEYCHAIN}"

      - name: package tarball
        run: |
          VERSION="${RELEASE_VERSION}"
          TARBALL="agentjail-${VERSION}-${{ matrix.platform }}.tar.gz"
          # Ship the project license + third-party attributions alongside the binaries.
          cp LICENSE NOTICE THIRD_PARTY_LICENSES dist/
          cd dist
          tar -czf "../${TARBALL}" \
            agentjail agentjail-hook \
            LICENSE NOTICE THIRD_PARTY_LICENSES
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: agentjail-${{ matrix.platform }}
          path: agentjail-*-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  macos-app:
    name: build notarized macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: cmd/agentjail/ui/frontend/.bun-version

      - name: build web UI and verify attributions
        run: |
          make ui
          ./scripts/gen-third-party-licenses.sh
          git diff --exit-code -- THIRD_PARTY_LICENSES

      - name: import Developer ID identity and profiles
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_APP_PROVISION_PROFILE: ${{ secrets.APPLE_APP_PROVISION_PROFILE }}
          APPLE_EXTENSION_PROVISION_PROFILE: ${{ secrets.APPLE_EXTENSION_PROVISION_PROFILE }}
        run: |
          set -eu
          for required in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_APP_PROVISION_PROFILE APPLE_EXTENSION_PROVISION_PROFILE; do
            eval "value=\${$required:-}"
            if [ -z "$value" ]; then
              echo "missing required release secret: $required" >&2
              exit 1
            fi
          done
          KEYCHAIN="$RUNNER_TEMP/agentjail-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -d > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          mkdir -p "$RUNNER_TEMP/profiles"
          printf '%s' "$APPLE_APP_PROVISION_PROFILE" | base64 -d \
            > "$RUNNER_TEMP/profiles/com.blinkerlm.agentjail.provisionprofile"
          printf '%s' "$APPLE_EXTENSION_PROVISION_PROFILE" | base64 -d \
            > "$RUNNER_TEMP/profiles/com.blinkerlm.agentjail.extension.provisionprofile"
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "RELEASE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: configure notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_ID_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "APPLE_ID, APPLE_ID_PASSWORD, and APPLE_TEAM_ID are required" >&2
            exit 1
          fi
          xcrun notarytool store-credentials agentjail-ci-notary \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

      - name: build, sign, notarize, and staple app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
          SELFUPDATE_SIGNING_PUB_KEY: RWRg/Bbl+U571C1qv/08AwUwlvf6zG4lYzV8e0QHFd0FrjYTmImUoRpQ
          PROFILE_DIR: ${{ runner.temp }}/profiles
          SIGNING_MODE: developer-id
          NOTARY_PROFILE: agentjail-ci-notary
          NOTARIZE: '1'
          MACOS_APP_VERSION: ${{ env.RELEASE_VERSION }}
          MACOS_BUILD_NUMBER: ${{ github.run_number }}
        run: make macos-app

      - name: package, notarize, and verify DMG
        env:
          NOTARY_PROFILE: agentjail-ci-notary
          NOTARIZE: '1'
        run: |
          ./scripts/package-macos-dmg.sh
          xcrun stapler validate build/AgentJail.dmg
          hdiutil verify build/AgentJail.dmg

      - name: remove temporary signing keychain
        if: always()
        run: |
          if [ -n "${RELEASE_KEYCHAIN:-}" ] && [ -f "$RELEASE_KEYCHAIN" ]; then
            security delete-keychain "$RELEASE_KEYCHAIN"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: agentjail-macos-app
          path: build/AgentJail.dmg
          if-no-files-found: error

  macos-app-verify:
    name: verify notarized macOS DMG
    needs: macos-app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: agentjail-macos-app
          path: dist/

      - name: verify transported app
        run: |
          set -eu
          hdiutil verify dist/AgentJail.dmg
          MOUNT="$RUNNER_TEMP/agentjail-dmg"
          mkdir -p "$MOUNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" dist/AgentJail.dmg
          trap 'hdiutil detach "$MOUNT"' EXIT
          APP="$MOUNT/AgentJail.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl -a -vvv -t exec "$APP"
          for binary in \
            "$APP/Contents/MacOS/AgentJail" \
            "$APP/Contents/Resources/bin/agentjail" \
            "$APP/Contents/Resources/bin/agentjail-hook" \
            "$APP/Contents/Library/SystemExtensions/com.blinkerlm.agentjail.extension.systemextension/Contents/MacOS/com.blinkerlm.agentjail.extension"; do
            lipo -verify_arch arm64 x86_64 "$binary"
          done
          "$APP/Contents/Resources/bin/agentjail" version

      - name: verify terminal installer against transported DMG
        env:
          AGENTJAIL_DRY_RUN: '1'
          AGENTJAIL_VERSION: ${{ env.RELEASE_VERSION }}
          LOCAL_MACOS_DMG: ${{ github.workspace }}/dist/AgentJail.dmg
        run: sh install.sh

  # Source-of-truth gate for the standalone CLI and Homebrew artifacts. Each
  # darwin tarball is extracted with the non-browser transport (curl + tar,
  # neither sets com.apple.quarantine), and verify.sh asserts it is quarantine-free
  # AND actually executes. Each arch runs on its NATIVE runner so the execution
  # check is real: macos-14 = arm64 (AMFI-strict), macos-13 = x86_64.
  gatekeeper-verify:
    name: verify Gatekeeper-clean (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
          - platform: darwin-amd64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: agentjail-${{ matrix.platform }}
          path: dist/

      - name: extract + verify Gatekeeper-clean + signature
        run: |
          set -eu
          TARBALL=$(ls dist/agentjail-*-${{ matrix.platform }}.tar.gz)
          echo "extracting ${TARBALL}"
          mkdir -p extracted
          tar -xzf "${TARBALL}" -C extracted
          chmod +x test/macos-gatekeeper/verify.sh
          test/macos-gatekeeper/verify.sh "extracted/agentjail"

          # Verify code signature if binaries are signed
          for bin in extracted/agentjail extracted/agentjail-hook; do
            if codesign --verify "${bin}" 2>/dev/null; then
              echo "✓ $(basename ${bin}): signed and valid"
              codesign -dvv "${bin}" 2>&1 | grep -E "Authority|TeamIdentifier" || true
            else
              echo "⚠ $(basename ${bin}): not signed (expected if APPLE_CERTIFICATE_P12 secret is not set)"
            fi
          done

  release:
    name: create GitHub release
    needs: [build, gatekeeper-verify, macos-app-verify]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: compute SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz AgentJail.dmg > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: sign SHA256SUMS with minisign
        if: ${{ env.MINISIGN_KEY != '' }}
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -yqq minisign
          echo "$MINISIGN_KEY" | base64 -d > /tmp/minisign.key
          minisign -S -s /tmp/minisign.key -m dist/SHA256SUMS \
            -x dist/SHA256SUMS.minisig \
            -t "agentjail ${{ env.RELEASE_VERSION }}" -q
          rm -f /tmp/minisign.key
          echo "SHA256SUMS.minisig created"

      - name: extract CHANGELOG section for this release
        id: changelog
        run: |
          VERSION="${RELEASE_VERSION}"
          # Extract everything from the ## $VERSION line to the next version heading.
          BODY=$(awk "/^## ${VERSION}[ $]/{found=1; next} found && /^## v[0-9]/{exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release ${VERSION}. See CHANGELOG.md for details."
          fi
          # Write to a file to handle multi-line body safely.
          printf '%s\n' "$BODY" > /tmp/release-body.md
          echo "body_path=/tmp/release-body.md" >> "$GITHUB_OUTPUT"

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          draft: false
          prerelease: ${{ contains(env.RELEASE_VERSION, '-alpha') || contains(env.RELEASE_VERSION, '-beta') || contains(env.RELEASE_VERSION, '-rc') }}
          files: |
            dist/*.tar.gz
            dist/AgentJail.dmg
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
            LICENSE
            NOTICE
            THIRD_PARTY_LICENSES

  # Push a generated binary formula to the Homebrew tap so `brew install
  # LuD1161/tap/agentjail` tracks releases.
  # Stable releases only — never prereleases. No-ops until the HOMEBREW_TAP_TOKEN
  # secret exists (fine-grained PAT or GitHub App token owned by LuD1161, with
  # contents:write on LuD1161/homebrew-tap; the default GITHUB_TOKEN cannot push
  # to another repository).
  homebrew:
    name: update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(env.RELEASE_VERSION, '-alpha') && !contains(env.RELEASE_VERSION, '-beta') && !contains(env.RELEASE_VERSION, '-rc') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: recompute SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS

      - name: render Formula/agentjail.rb
        run: |
          set -eu
          TAG="${RELEASE_VERSION}"
          VERSION="${TAG#v}"
          REPO="LuD1161/agentjail"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          sha() { grep "  agentjail-${TAG}-$1.tar.gz$" dist/SHA256SUMS | awk '{print $1}'; }
          DARWIN_ARM=$(sha darwin-arm64)
          DARWIN_AMD=$(sha darwin-amd64)
          LINUX_ARM=$(sha linux-arm64)
          LINUX_AMD=$(sha linux-amd64)

          mkdir -p Formula
          cat > Formula/agentjail.rb <<RUBY
          # Generated by .github/workflows/release.yml — do not edit by hand.
          class Agentjail < Formula
            desc "Policy guardrail for coding agents (Claude Code, Codex, Cursor)"
            homepage "https://agentjail.io"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "${BASE}/agentjail-${TAG}-darwin-arm64.tar.gz"
                sha256 "${DARWIN_ARM}"
              end
              on_intel do
                url "${BASE}/agentjail-${TAG}-darwin-amd64.tar.gz"
                sha256 "${DARWIN_AMD}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE}/agentjail-${TAG}-linux-arm64.tar.gz"
                sha256 "${LINUX_ARM}"
              end
              on_intel do
                url "${BASE}/agentjail-${TAG}-linux-amd64.tar.gz"
                sha256 "${LINUX_AMD}"
              end
            end

            def install
              bin.install "agentjail", "agentjail-hook"
              %w[agentjail-daemon agentjail-shield agentjail-netproxy agentjail-secrets].each do |role|
                bin.install_symlink "agentjail" => role
              end
            end

            def post_install
              ENV["AGENTJAIL_INSTALL_METHOD"] = "brew"
              system bin/"agentjail", "install", "--all"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/agentjail version")
            end
          end
          RUBY
          echo "--- Formula/agentjail.rb ---"
          cat Formula/agentjail.rb

      - name: push formula to tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ env.RELEASE_VERSION }}
        run: |
          set -eu
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping tap push."
            echo "Create the LuD1161/homebrew-tap repo and add the secret to enable."
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/LuD1161/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp Formula/agentjail.rb tap/Formula/agentjail.rb
          cd tap
          git config user.name "agentjail-release"
          git config user.email "release@agentjail.io"
          git add Formula/agentjail.rb
          git commit -m "agentjail ${TAG}" || { echo "no change"; exit 0; }
          git push
